<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14111e">
  <meta name="description" content="Seu playground de sorte. Jogue Tiger Slots, Double e Minas com Bryams, créditos fictícios e gratuitos. Só vale a diversão.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tiger Club • Só vale a diversão</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-games" viewBox="0 0 24 24"><path d="M7 7h10c3 0 4 3 4 8s-3 5-6 1H9c-3 4-6 4-6-1s1-8 4-8Z"/><path d="M8 10v5m-2.5-2.5h5M16 11h.01M18 14h.01"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 8V5a2 2 0 0 0-2-2L4 6v13a2 2 0 0 0 2 2h14V8H5a2 2 0 0 1 0-4"/><path d="M20 12h-5v5h5M16 14.5h.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><path d="M3 8h18v5H3zm2 5v8h14v-8M12 8v13"/><path d="M12 8H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-spin" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 7a8 8 0 0 1 13-1L20 12M4 12l1.5 6a8 8 0 0 0 13-1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#inicio" aria-label="Tiger Club, início"><span class="brand-mark">T<span>✦</span></span><span>TIGER<span class="brand-club">CLUB</span></span></a>
      <button class="header-wallet" data-action="wallet" aria-label="Abrir carteira"><span class="coin">B</span><span id="header-balance">1.000</span><span class="wallet-plus">+</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="#inicio" data-nav="inicio"><svg class="icon"><use href="#i-home"/></svg><span>Início</span></a>
      <a href="#jogos" data-nav="jogos"><svg class="icon"><use href="#i-games"/></svg><span>Jogos</span></a>
      <a href="#carteira" data-nav="carteira"><svg class="icon"><use href="#i-wallet"/></svg><span>Carteira</span></a>
      <a href="#perfil" data-nav="perfil"><svg class="icon"><use href="#i-user"/></svg><span>Meu club</span></a>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-content" id="sheet-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Ative o JavaScript para jogar. Todos os jogos usam créditos fictícios.</p></noscript>
</body>
</html>
